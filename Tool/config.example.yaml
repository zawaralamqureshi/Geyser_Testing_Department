# Geyser Cycler Tool - Example config
# Copy to config.yaml and adjust paths/keys as needed.

paths:
  cells_root: D:\Electrical_tests\Cells
  blocks_root: D:\Electrical_tests\Blocks
  staging_root: D:\Electrical_tests\_staging

bq:
  project: geyser-testing
  dataset: electrical_tests
  # Path to service account JSON key (optional; uses Application Default Credentials if omitted)
  service_account_key: null  # e.g. path/to/geyser-testing-key.json

gcs:
  # If set, parquet is uploaded to GCS and BigQuery loads from GCS (memory-efficient)
  gcs_bucket: ""
  gcs_staging_prefix: staging/

esr:
  delays_s: [0.010, 1.0]
  strict_mode: true
  tolerance_s: 0.0

# Extra seconds between stitched RAW cycle files on BigQuery time_series.time_s (not in RAW files).
# Default in code is 0; omit raw_ts or keep 0 — set e.g. 0.01 only if you want a synthetic delimiter.
raw_ts:
  inter_cycle_gap_s: 0.0

# Curves table: downsampled for Looker; ESR still uses full-resolution time_series upstream.
curves:
  max_points_per_run: 50000   # Legacy; not used for time_series
  curves_per_step_segment: true
  max_points_per_cycling_segment: 100
  max_points_per_cv_segment: 500
  min_points_per_cv_segment_if_low_rate_hz: 120.0
  max_points_per_cv_segment_low_rate: 200
  # Legacy whole-cycle mode (if curves_per_step_segment: false):
  points_per_cycle_cycling: 150
  points_per_cycle_cv: 1500
